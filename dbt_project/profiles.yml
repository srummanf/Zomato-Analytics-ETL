zomato_analytics:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      port: "{{ env_var('POSTGRES_PORT', '5439') | as_number }}"
      dbname: "{{ env_var('POSTGRES_DB', 'zomato') }}"
      user: "{{ env_var('POSTGRES_USER', 'zomato') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', 'zomato') }}"
      schema: public
      threads: 4
