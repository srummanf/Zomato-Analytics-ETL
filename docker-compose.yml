services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zomato}
      POSTGRES_USER: ${POSTGRES_USER:-zomato}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zomato}
    ports:
      - "5439:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zomato}"]
      interval: 5s
      timeout: 5s
      retries: 5

  doris:
    image: apache/doris:all-in-one-4.1.3
    ports:
      - "8030:8030"
      - "9030:9030"
      - "8040:8040"
    volumes:
      - doris_data:/opt/apache-doris
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/9030'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  airflow:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    command: standalone
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-zomato}
      POSTGRES_USER: ${POSTGRES_USER:-zomato}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zomato}
      DORIS_HOST: doris
      DORIS_QUERY_PORT: "9030"
      DORIS_STREAM_LOAD_PORT: "8040"
      DBT_PROFILES_DIR: /opt/project/dbt_project
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    ports:
      - "8080:8080"
    volumes:
      - ./data:/opt/project/data
    depends_on:
      postgres:
        condition: service_healthy
      doris:
        condition: service_healthy

  metabase:
    image: metabase/metabase:v0.63.16.6
    ports:
      - "3030:3000"
    volumes:
      - metabase_data:/metabase.db
    depends_on:
      postgres:
        condition: service_healthy
      doris:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/3000'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

volumes:
  pg_data:
  doris_data:
  metabase_data:
