services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zomato}
      POSTGRES_USER: ${POSTGRES_USER:-zomato}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zomato}
    ports:
      - "5439:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zomato}"]
      interval: 5s
      timeout: 5s
      retries: 5

  doris:
    image: apache/doris:all-in-one-4.1.3
    ports:
      - "8030:8030"
      - "9030:9030"
      - "8040:8040"
    volumes:
      - doris_data:/opt/apache-doris
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/9030'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

volumes:
  pg_data:
  doris_data:
