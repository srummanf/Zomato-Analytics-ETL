services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zomato}
      POSTGRES_USER: ${POSTGRES_USER:-zomato}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zomato}
    ports:
      - "5439:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zomato}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
